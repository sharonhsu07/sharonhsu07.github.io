<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Inspiration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Global Reset for Square Look */
        * {
            border-radius: 0 !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            background-attachment: fixed;
            color: #111;
            overflow-x: hidden;
        }
        
        /* --- Premium Animations --- */
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes slideInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .card-enter {
            opacity: 0; 
            animation: slideInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Page Transitions */
        .page-container {
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 100%;
            position: absolute;
            top: 0; left: 0;
        }
        .page-active {
            opacity: 1; transform: translateY(0); pointer-events: auto; position: relative; z-index: 10;
        }
        .page-hidden {
            opacity: 0; transform: translateY(20px); pointer-events: none; position: absolute; z-index: 0;
        }

        /* Custom Color Input */
        .color-wrapper {
            position: relative;
            overflow: hidden;
            border: 1px solid #eee;
            background: white;
            transition: all 0.3s ease;
        }
        .color-wrapper:hover {
            border-color: #000;
            transform: scale(1.02);
        }
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 150%; height: 150%;
            position: absolute; top: -25%; left: -25%; cursor: pointer; padding: 0; background: none;
        }

        /* Minimal Input Style */
        .hex-input {
            background: transparent;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s ease;
            text-transform: uppercase;
        }
        .hex-input:focus {
            outline: none;
            border-bottom-color: #000;
        }
        .hex-input::placeholder { color: #e5e5e5; }

        /* Preset Swatches - Minimal */
        .preset-swatch {
            width: 24px; height: 24px; cursor: pointer;
            transition: transform 0.2s; border: 1px solid transparent;
        }
        .preset-swatch:hover { 
            transform: scale(1.2); border: 1px solid #111; z-index: 10;
        }
        
        /* UI Utilities */
        .btn-line { @apply px-6 py-2 text-sm font-medium text-black bg-transparent border border-gray-300 hover:bg-black hover:text-white transition-all uppercase tracking-wider; }
        .btn-primary-square { @apply px-12 py-5 text-white bg-black hover:bg-gray-800 transition-all font-medium text-lg tracking-widest border border-transparent; }
        .palette-card { @apply bg-transparent flex flex-col transition-all duration-300 border border-transparent hover:border-gray-200 p-2; }
        .mode-toggle-btn { @apply px-6 py-2 text-xs font-medium transition-all border border-gray-300 hover:bg-gray-50 bg-white text-gray-500; }
        .mode-toggle-btn.active { @apply bg-black text-white border-black; }
        .color-chip:hover { opacity: 0.95; }
        .color-chip:hover .copy-hint { opacity: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-black selection:text-white">

    <!-- Navbar -->
    <nav id="navbar" class="fixed top-0 w-full bg-white/95 backdrop-blur-sm z-50 transition-transform duration-500 transform -translate-y-full border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <button onclick="goBack()" id="backBtn" class="flex items-center gap-2 text-gray-400 hover:text-black transition-colors hidden text-xs font-medium uppercase tracking-widest group">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" class="group-hover:-translate-x-1 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
                Back
            </button>
            <div id="navSpacer" class="w-16"></div>
            <button onclick="resetApp()" class="text-xs font-medium text-gray-400 hover:text-black transition-colors uppercase tracking-[0.2em]">Restart</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 relative mt-20 flex flex-col items-center fade-in">
        
        <!-- STEP 1: Color Picker (Redesigned) -->
        <div id="step1" class="page-container page-active flex flex-col items-center justify-center min-h-[70vh]">
            <div class="w-full max-w-2xl animate-fadeIn flex flex-col items-center gap-12">
                
                <!-- Title -->
                <h1 class="text-5xl md:text-6xl font-thin text-black tracking-tighter text-center leading-none opacity-90">
                    Color<br><span class="font-bold">Pick.</span>
                </h1>
                
                <div class="flex flex-col items-center w-full gap-8">
                    <!-- Main Picker Wrapper -->
                    <div class="color-wrapper w-40 h-40 md:w-40 md:h-40 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] group cursor-pointer">
                        <input type="color" id="baseColorInput" value="#5778a2">
                        <!-- Select Color Text Overlay -->
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                            <span class="text-[10px] font-bold tracking-[0.2em] text-white/90 drop-shadow-md uppercase text-center leading-relaxed">
                                Select<br>Color
                            </span>
                        </div>
                    </div>

                    <!-- Editable Hex Input Group -->
                    <div class="flex items-center justify-center gap-2 group relative">
                        <span class="text-2xl font-light text-gray-300 select-none">#</span>
                        <input type="text" id="hexInput" value="5778a2" maxlength="6"
                               class="hex-input w-40 text-center text-3xl md:text-4xl font-light text-black tracking-widest placeholder-gray-200"
                               placeholder="HEX">
                    </div>

                    <!-- Minimal Presets -->
                    <div class="flex items-center gap-6 mt-2">
                        <span class="text-[10px] font-bold tracking-[0.2em] text-gray-300 uppercase">Start With</span>
                        <div class="flex gap-4">
                            <div class="preset-swatch bg-black" onclick="setBaseColor('#000000')"></div>
                            <div class="preset-swatch bg-red-500" onclick="setBaseColor('#ef4444')"></div>
                            <div class="preset-swatch bg-blue-500" onclick="setBaseColor('#3b82f6')"></div>
                            <div class="preset-swatch bg-yellow-400" onclick="setBaseColor('#facc15')"></div>
                            <div class="preset-swatch bg-emerald-500" onclick="setBaseColor('#10b981')"></div>
                        </div>
                    </div>
                </div>

                <div class="pt-6">
                    <button onclick="startGeneration()" class="btn-primary-square flex items-center justify-center gap-4 group">
                        GENERATE PALETTES
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" class="group-hover:translate-x-1 transition-transform"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- STEP 2: Results (UPDATED: Added Base Color Edit) -->
        <div id="step2" class="page-container page-hidden w-full max-w-7xl">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 border-b border-gray-100 pb-6 gap-6">
                <div class="flex flex-col gap-6 items-start">
                    <div>
                        <h2 class="text-4xl font-light text-black tracking-tight">Curated Palettes</h2>
                        <p class="text-[10px] md:text-xs text-gray-400 mt-2 uppercase tracking-wider font-medium">Click EXPLORE to discover more color combinations</p>
                    </div>

                    <!-- NEW: Based On Control for Step 2 -->
                    <div class="flex items-center gap-4 pl-1 flex-wrap">
                        <span class="text-[10px] font-bold text-gray-300 uppercase tracking-widest">BASED ON</span>
                        
                        <!-- Wrapper for Color Input and Visual Box -->
                        <div class="relative w-8 h-8 overflow-hidden border border-gray-200 transition-transform group-hover:scale-105 shadow-sm">
                            <div id="step2BaseColorBox" class="w-full h-full bg-gray-200 pointer-events-none"></div>
                            <!-- Hidden Input overlay -->
                            <input type="color" id="step2ColorInput" class="absolute top-0 left-0 w-[150%] h-[150%] -top-[25%] -left-[25%] opacity-0 cursor-pointer" title="Change Base Color">
                        </div>
                        
                        <!-- Change Button -->
                        <button onclick="applyStep2Changes()" class="ml-2 px-4 py-1.5 text-[10px] font-bold uppercase tracking-widest text-black border border-gray-200 hover:bg-black hover:text-white transition-all active:scale-95">
                            CHANGE
                        </button>
                    </div>
                </div>
                
                <button onclick="regenerateStep2()" class="btn-line flex items-center gap-2 group mb-1" title="Shuffle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" class="group-hover:rotate-180 transition-transform duration-500"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                    Shuffle
                </button>
            </div>
            
            <div id="paletteContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-20">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- STEP 3: Details & Explore (Editable Palette + Change Button) -->
        <div id="step3" class="page-container page-hidden w-full max-w-7xl">
            <!-- Header with Controls -->
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 border-b border-gray-100 pb-6 gap-6">
                <div class="flex flex-col gap-6 items-start">
                    <div>
                        <h2 class="text-4xl font-light text-black tracking-tight">Variations</h2>
                        <p class="text-[10px] md:text-xs text-gray-400 mt-2 uppercase tracking-wider font-medium">Click EXPLORE to discover more color combinations</p>
                    </div>

                    <!-- Seed Color Indicator (Editable & Change Button) -->
                    <div class="flex items-center gap-4 pl-1 flex-wrap">
                        <span class="text-[10px] font-bold text-gray-300 uppercase tracking-widest">BASED ON</span>
                        <!-- Editable Palette Container -->
                        <div id="detailBasePaletteDisplay" class="flex items-center gap-1 border border-gray-100 p-1 bg-white shadow-sm">
                            <!-- JS will inject the 5 editable color boxes here -->
                        </div>
                        
                        <!-- Change Button -->
                        <button onclick="applyBaseChanges()" class="ml-2 px-4 py-1.5 text-[10px] font-bold uppercase tracking-widest text-black border border-gray-200 hover:bg-black hover:text-white transition-all active:scale-95">
                            CHANGE
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center gap-6">
                    <!-- Mode Toggles -->
                    <div class="flex gap-4">
                        <button onclick="setExploreMode('same')" id="btnModeSame" class="mode-toggle-btn active">KEEP HUE</button>
                        <button onclick="setExploreMode('shift')" id="btnModeShift" class="mode-toggle-btn">SHIFT HUE</button>
                    </div>

                    <!-- Shuffle Button -->
                    <button onclick="regenerateStep3()" class="p-3 border border-gray-300 text-black hover:bg-black hover:text-white transition-all group" title="Shuffle Variations">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" class="group-hover:rotate-180 transition-transform duration-500"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                    </button>
                </div>
            </div>
            
            <!-- Grid columns match Step 2 (lg:grid-cols-3) -->
            <div id="detailContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-20">
                <!-- Detail cards injected here -->
            </div>
        </div>

    </main>

    <!-- NEW: Sticky Footer -->
    <footer class="w-full py-1.5 text-center border-t border-gray-100 mt-auto bg-white/50 backdrop-blur-sm fade-in">
        <p class="text-[8px] text-gray-400 uppercase tracking-widest font-medium">
            &copy; <span id="year"></span> ColorPick. All rights reserved.
        </p>
    </footer>

    <!-- Toast (Fixed Top Center) - Z-Index 100 to stay above everything -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-black text-white px-8 py-4 transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none flex items-center gap-4 z-[100] text-sm font-medium tracking-wide shadow-2xl">
        <span class="w-2 h-2 bg-white"></span>
        <span id="toastMsg">COPIED</span>
    </div>

    <script>
        // --- State ---
        let currentStep = 1;
        let baseColorHex = "#5778A2";
        let currentBasePalette = []; // Array of Hex strings
        let currentDetailStyle = null;
        let exploreMode = 'same'; 
        let globalSeed = 0; 

        // DOM Elements
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const navbar = document.getElementById('navbar');
        const backBtn = document.getElementById('backBtn');
        const navSpacer = document.getElementById('navSpacer');
        const colorInput = document.getElementById('baseColorInput');
        const hexInput = document.getElementById('hexInput');
        // Step 2 new elements
        const step2ColorInput = document.getElementById('step2ColorInput');
        const step2BaseColorBox = document.getElementById('step2BaseColorBox');
        
        // Set Copyright Year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Events
        
        // 1. Color Picker Change -> Update Hex Input & State
        colorInput.addEventListener('input', (e) => {
            const hex = e.target.value;
            baseColorHex = hex;
            hexInput.value = hex.substring(1).toUpperCase(); // remove #
        });

        // 2. Hex Input Change -> Update Color Picker & State
        hexInput.addEventListener('input', (e) => {
            let val = e.target.value.toUpperCase();
            
            // Allow only Hex chars
            val = val.replace(/[^0-9A-F]/g, '');
            e.target.value = val;

            if (val.length === 6) {
                const fullHex = "#" + val;
                baseColorHex = fullHex;
                colorInput.value = fullHex;
            }
        });

        // 3. Step 2 Color Input Change
        step2ColorInput.addEventListener('input', (e) => {
            const hex = e.target.value;
            baseColorHex = hex; // Update global state immediately
            step2BaseColorBox.style.backgroundColor = hex;
            // Sync with Step 1 inputs too, just in case
            colorInput.value = hex;
            hexInput.value = hex.substring(1).toUpperCase();
        });

        function focusHexInput() {
            hexInput.focus();
        }

        function setBaseColor(hex) {
            baseColorHex = hex;
            colorInput.value = hex;
            hexInput.value = hex.substring(1).toUpperCase();
        }

        // --- Navigation ---

        function startGeneration() {
            // Validate Hex before starting
            if(hexInput.value.length < 6) {
                // If invalid, fallback or just use current picker value
                hexInput.value = colorInput.value.substring(1).toUpperCase();
                baseColorHex = colorInput.value;
            }
            transitionTo(2);
            showNavbar(true);
            
            // Sync Step 2 UI
            updateStep2BaseColorUI(baseColorHex);
            
            generateMainPalettes(baseColorHex);
        }

        function updateStep2BaseColorUI(hex) {
            step2BaseColorBox.style.backgroundColor = hex;
            step2ColorInput.value = hex;
        }

        function regenerateStep2() {
            const container = document.getElementById('paletteContainer');
            container.style.opacity = '0.5';
            globalSeed++;
            setTimeout(() => {
                generateMainPalettes(baseColorHex);
                container.style.opacity = '1';
            }, 300);
        }

        function applyStep2Changes() {
            // User clicked Change in Step 2
            regenerateStep2();
        }

        function viewDetails(styleType, colors) {
            // Store the full palette array copy to avoid reference issues
            currentBasePalette = [...colors];
            currentDetailStyle = styleType;
            exploreMode = 'same'; 
            
            updateExploreButtons();

            // RENDER THE BASE PALETTE IN HEADER (EDITABLE)
            const baseContainer = document.getElementById('detailBasePaletteDisplay');
            baseContainer.innerHTML = '';
            
            currentBasePalette.forEach((c, index) => {
                // Wrapper for Input + Visual
                const wrapper = document.createElement('div');
                wrapper.className = "relative w-6 h-6 border border-gray-100 overflow-hidden cursor-pointer hover:scale-105 transition-transform";
                
                // Visual Color Box
                const visual = document.createElement('div');
                visual.className = "w-full h-full pointer-events-none";
                visual.style.backgroundColor = c;
                
                // Hidden Color Input
                const input = document.createElement('input');
                input.type = "color";
                input.value = c;
                // Reuse the 'input[type="color"]' style from CSS but ensure it covers container
                input.className = "absolute top-0 left-0 w-[150%] h-[150%] -top-[25%] -left-[25%] opacity-0 cursor-pointer";
                
                // Listener: Update visual & state on change
                input.addEventListener('input', (e) => {
                    const newColor = e.target.value;
                    visual.style.backgroundColor = newColor;
                    currentBasePalette[index] = newColor;
                });

                wrapper.appendChild(visual);
                wrapper.appendChild(input);
                baseContainer.appendChild(wrapper);
            });
            
            if (currentStep === 3) {
                const container = document.getElementById('detailContainer');
                container.style.opacity = '0'; 
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => {
                    generateDetailPalettes();
                    container.style.opacity = '1';
                }, 400);
            } else {
                transitionTo(3);
                backBtn.classList.remove('hidden');
                navSpacer.classList.add('hidden');
                generateDetailPalettes();
            }
        }

        // NEW: Function to apply changes from the top editable palette
        function applyBaseChanges() {
            // Simply trigger regeneration using the updated currentBasePalette
            regenerateStep3();
        }

        function regenerateStep3() {
            const container = document.getElementById('detailContainer');
            container.style.opacity = '0.5';
            globalSeed++;
            setTimeout(() => {
                generateDetailPalettes();
                container.style.opacity = '1';
            }, 300);
        }

        function setExploreMode(mode) {
            exploreMode = mode;
            updateExploreButtons();
            regenerateStep3();
        }

        function updateExploreButtons() {
            const btnSame = document.getElementById('btnModeSame');
            const btnShift = document.getElementById('btnModeShift');
            
            if (exploreMode === 'same') {
                btnSame.classList.add('active');
                btnShift.classList.remove('active');
            } else {
                btnSame.classList.remove('active');
                btnShift.classList.add('active');
            }
        }

        function goBack() {
            if (currentStep === 3) {
                transitionTo(2);
                backBtn.classList.add('hidden');
                navSpacer.classList.remove('hidden');
            }
        }

        function resetApp() {
            transitionTo(1);
            showNavbar(false);
            backBtn.classList.add('hidden');
            navSpacer.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('paletteContainer').innerHTML = '';
                document.getElementById('detailContainer').innerHTML = '';
            }, 500);
        }

        function transitionTo(step) {
            [step1, step2, step3].forEach(el => {
                el.classList.remove('page-active');
                el.classList.add('page-hidden');
            });
            const target = document.getElementById(`step${step}`);
            target.classList.remove('page-hidden');
            target.classList.add('page-active');
            
            setTimeout(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 50);

            currentStep = step;
        }

        function showNavbar(show) {
            if (show) navbar.classList.remove('-translate-y-full');
            else navbar.classList.add('-translate-y-full');
        }

        // --- Logic & Algorithms ---

        function generateMainPalettes(hex) {
            const hsl = hexToHSL(hex);
            const container = document.getElementById('paletteContainer');
            container.innerHTML = '';

            const items = [
                {style: 'fresh', variant: 'A', title: 'Clean & Soft', sub: 'Airy, Minimalist'},
                {style: 'fresh', variant: 'B', title: 'Natural & Warm', sub: 'Organic, Cozy'},
                {style: 'dark', variant: 'A', title: 'Modern Dark', sub: 'Sleek, High Contrast'},
                {style: 'dark', variant: 'B', title: 'Deep & Muted', sub: 'Elegant, Professional'},
                {style: 'vibrant', variant: 'A', title: 'Vibrant Pop', sub: 'Energetic, Bold'},
                {style: 'vibrant', variant: 'B', title: 'Electric Dream', sub: 'Neon, Futuristic'} 
            ];

            items.forEach((item, index) => {
                const colors = generatePalette(hsl, item.style, item.variant, hex);
                renderPaletteCard(container, colors, item.style, item.title, item.sub, false, index);
            });
        }

        function generateDetailPalettes() {
            // currentBasePalette is now an Array of Hex strings
            const container = document.getElementById('detailContainer');
            container.innerHTML = '';

            for(let i=0; i<6; i++) {
                const randomOffset = i + globalSeed * 7; 
                // Pass the whole palette array to the new function
                const colors = generateExplorePalette(currentBasePalette, currentDetailStyle, exploreMode, i, randomOffset);
                const keywords = getKeywordDescription(currentDetailStyle, exploreMode, i);
                renderPaletteCard(container, colors, currentDetailStyle, `Variation ${i+1}`, keywords, true, i);
            }
        }
        
        function getKeywordDescription(style, mode, index) {
            // Dynamic titles based on logic
            if (mode === 'shift') {
                const shifts = ["Analogous", "Complementary", "Split Comp", "Triadic Shift", "Hue Rotation", "Cool/Warm Flip"];
                return shifts[index % shifts.length];
            } else {
                const vars = ["More Vivid", "Softer / Muted", "Brighter", "Darker / Deep", "Warmer Tone", "Cooler Tone"];
                return vars[index % vars.length];
            }
        }

        // NEW: Generates variation based on an entire input palette
        function generateExplorePalette(baseColorsHex, style, mode, cardIndex, seedOffset) {
            // Convert all base colors to HSL first
            let baseHSL = baseColorsHex.map(hex => hexToHSL(hex));
            let newColors = [];

            // Define adjustment parameters based on cardIndex
            let hAdj = 0;
            let sAdj = 0;
            let lAdj = 0;
            
            // Random factors - Increase range significantly for more variation
            // Use seedOffset/globalSeed to influence the "base" randoms so shuffles feel distinct
            
            // Derive a pseudo-random factor from the seed so it feels "shuffled" but consistent for that seed
            // We also add pure Math.random() for noise.
            
            if (mode === 'shift') {
                // SHIFT MODE: Rotate the hue of the entire palette
                // Base shifts: 30, 180 (comp), 150 (split), 90, 60, -30
                // New: Add a "Shuffle Rotation" that changes every time you click shuffle
                const shuffleRotation = (Math.floor(seedOffset / 7) * 45); // Rotate 45deg per shuffle
                
                const shifts = [30, 180, 150, 90, 60, -30];
                let baseShift = shifts[cardIndex % shifts.length];
                
                // Add large random noise (+/- 15deg)
                hAdj = baseShift + shuffleRotation + (Math.random() * 30 - 15);
                
                // Randomize Sat/Lit slightly in Shift mode too
                sAdj = (Math.random() * 10 - 5);
                lAdj = (Math.random() * 10 - 5);

            } else {
                // SAME MODE: Keep Hue, tweak S and L (Vibe change)
                
                // Multiply effect intensity by a random factor (0.8 to 1.5)
                const intensity = 0.8 + Math.random() * 0.7;
                
                // Add a global drift per shuffle
                const driftH = (Math.random() * 20 - 10);
                
                if (cardIndex % 6 === 0) { // Vivid
                    sAdj = 20 * intensity; 
                    lAdj = (Math.random() * 10 - 5); 
                } 
                else if (cardIndex % 6 === 1) { // Muted
                    sAdj = -25 * intensity; 
                    lAdj = 5 + (Math.random() * 10 - 5); 
                } 
                else if (cardIndex % 6 === 2) { // Brighter
                    lAdj = 15 * intensity; 
                    sAdj = 5 + (Math.random() * 10 - 5); 
                } 
                else if (cardIndex % 6 === 3) { // Darker
                    lAdj = -20 * intensity; 
                    sAdj = 5 + (Math.random() * 10 - 5); 
                } 
                else if (cardIndex % 6 === 4) { // Warmer
                    hAdj = 15 + driftH; 
                    sAdj = (Math.random() * 10 - 5);
                } 
                else if (cardIndex % 6 === 5) { // Cooler
                    hAdj = -15 + driftH; 
                    sAdj = (Math.random() * 10 - 5);
                }
                
                hAdj += driftH;
            }

            // Apply logic to each color in the palette
            newColors = baseHSL.map(c => {
                let newH = (c.h + hAdj) % 360;
                
                // Increased Per-Color Scatter for more "Organic" randomness
                // Old: +/- 2.5. New: +/- 8
                let scatterS = (Math.random() * 16 - 8);
                let scatterL = (Math.random() * 16 - 8);
                
                // Clamp S and L
                let newS = Math.max(5, Math.min(100, c.s + sAdj + scatterS));
                let newL = Math.max(5, Math.min(98, c.l + lAdj + scatterL));
                
                return HSLToHex(newH, newS, newL);
            });

            return newColors;
        }

        function generatePalette(baseHSL, style, variant, forceColor = null) {
            let colors = [];
            let h = baseHSL.h;
            const count = forceColor ? 4 : 5;
            
            let shiftH = (Math.random() * 40 - 20); 
            let shiftS = (Math.random() * 20 - 10);
            
            for (let i = 0; i < count; i++) {
                let newH, newS, newL;
                let rndHue = (Math.random() * 40 - 20); 
                let rndSat = (Math.random() * 30);      
                let rndLit = (Math.random() * 20);      

                if (style === 'fresh') {
                    let hueOffset = (i * 15) - 30; 
                    if (variant === 'A') { 
                        newH = (h + hueOffset + rndHue + shiftH) % 360;
                        newS = 5 + rndSat + (i * 5) + shiftS; 
                        newL = 85 + (i % 2 === 0 ? 5 : -10) + rndLit;
                    } else { 
                        newH = (h + hueOffset + rndHue + shiftH) % 360;
                        newS = 20 + rndSat + (i * 5) + shiftS;
                        newL = 80 + (i % 2 === 0 ? 5 : -10) + rndLit;
                    }
                } 
                else if (style === 'dark') {
                    if (variant === 'A') { 
                        if (i === 0) { newH = (h + 180 + rndHue + shiftH) % 360; newS = 90 + shiftS; newL = 60 + (rndLit/2); } 
                        else if (i === 1) { newH = (h + rndHue + shiftH) % 360; newS = 80 + shiftS; newL = 70 + (rndLit/2); } 
                        else { newH = (h + (i * 10) + shiftH) % 360; newS = 15 + (shiftS/2); newL = 10 + (i * 3) + (rndLit/3); }
                    } else { 
                         if (i === 0) { newH = h + rndHue + shiftH; newS = 40 + shiftS; newL = 50 + rndLit; } 
                         else { newH = (h + (i * 15) + shiftH) % 360; newS = 20 + (shiftS/2); newL = 15 + (i * 4) + (rndLit/3); }
                    }
                } 
                else { 
                    if (variant === 'B') { 
                        let hueMap = [0, 180, 180, 90, 270];
                        newH = (h + hueMap[i] + rndHue + shiftH) % 360;
                        newS = 85 + (Math.random() * 15) + shiftS;
                        let lMap = [50, 90, 10, 80, 20];
                        newL = lMap[i % 5] + rndLit;
                    } else {
                        let hueMap = [0, 30, -30, 180, 210]; 
                        newH = (h + hueMap[i] + rndHue + shiftH) % 360;
                        newS = 70 + (Math.random() * 20) + shiftS;
                        let lMap = [50, 65, 40, 60, 45];
                        newL = lMap[i % 5] + rndLit;
                    }
                }
                
                if (newS > 100) newS = 100; if (newS < 0) newS = 0;
                if (newL > 100) newL = 100; if (newL < 0) newL = 0;
                
                colors.push(HSLToHex(newH, newS, newL));
            }
            if (forceColor) colors.push(forceColor);
            if(style !== 'dark') colors.sort((a,b) => hexToHSL(b).l - hexToHSL(a).l);
            return colors;
        }

        // --- Rendering ---
        function renderPaletteCard(container, colors, styleType, title, subtitle, isDetail = false, index = 0) {
            const card = document.createElement('div');
            card.className = "palette-card group cursor-default card-enter";
            card.style.animationDelay = `${index * 100}ms`;
            
            const grid = document.createElement('div');
            grid.className = "flex h-32 w-full mb-4 border border-gray-100";
            
            // To pass array correctly in onclick string, we need to serialize it
            const colorsString = JSON.stringify(colors).replace(/"/g, "&quot;");

            colors.forEach(color => {
                const block = document.createElement('div');
                block.className = "flex-1 color-chip relative group/chip flex items-end justify-center pb-3 border-r border-white/10 last:border-0";
                block.style.backgroundColor = color;
                const isDark = hexToHSL(color).l < 50;
                const textColor = isDark ? 'text-white/90' : 'text-black/90';
                block.innerHTML = `<div class="opacity-0 group-hover/chip:opacity-100 transition-opacity flex flex-col items-center"><span class="text-[10px] font-medium tracking-wider ${textColor}">${color.toUpperCase()}</span></div>`;
                block.onclick = (e) => { e.stopPropagation(); copyColor(color); };
                grid.appendChild(block);
            });

            grid.style.cursor = "pointer";
            // Pass the whole colors array to viewDetails
            grid.onclick = () => viewDetails(styleType, colors);

            const header = document.createElement('div');
            header.className = "flex justify-between items-end px-1"; 
            let headerContent = `<div><h3 class="font-medium text-black text-sm tracking-widest uppercase">${title}</h3><p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wide">${subtitle}</p></div>`;
            
            headerContent += `<div class="flex flex-col items-end opacity-30 group-hover:opacity-100 transition-opacity cursor-pointer duration-300" onclick="viewDetails('${styleType}', ${colorsString})">
                                <span class="text-[9px] text-gray-500 uppercase tracking-widest font-semibold border-b border-transparent hover:border-gray-400 hover:text-black transition-colors">EXPLORE</span>
                              </div>`;
            
            header.innerHTML = headerContent;
            card.appendChild(grid); card.appendChild(header); container.appendChild(card);
        }

        function copyColor(hex) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(hex)
                    .then(() => showToast(`COPIED: ${hex.toUpperCase()}`))
                    .catch(() => fallbackCopy(hex));
            } else {
                fallbackCopy(hex);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(`COPIED: ${text.toUpperCase()}`);
                }
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            setTimeout(() => { 
                toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none'); 
            }, 1500);
        }
        function hexToHSL(H) {
            let r = 0, g = 0, b = 0;
            if (H.length == 4) { r = "0x" + H[1] + H[1]; g = "0x" + H[2] + H[2]; b = "0x" + H[3] + H[3]; } 
            else if (H.length == 7) { r = "0x" + H[1] + H[2]; g = "0x" + H[3] + H[4]; b = "0x" + H[5] + H[6]; }
            r /= 255; g /= 255; b /= 255;
            let cmin = Math.min(r,g,b), cmax = Math.max(r,g,b), delta = cmax - cmin;
            let h = 0, s = 0, l = 0;
            if (delta == 0) h = 0;
            else if (cmax == r) h = ((g - b) / delta) % 6;
            else if (cmax == g) h = (b - r) / delta + 2;
            else h = (r - g) / delta + 4;
            h = Math.round(h * 60); if (h < 0) h += 360;
            l = (cmax + cmin) / 2; s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
            s = +(s * 100).toFixed(1); l = +(l * 100).toFixed(1);
            return { h, s, l };
        }
        function HSLToHex(h, s, l) {
            s /= 100; l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
            r = Math.round((r + m) * 255).toString(16); g = Math.round((g + m) * 255).toString(16); b = Math.round((b + m) * 255).toString(16);
            if (r.length == 1) r = "0" + r; if (g.length == 1) g = "0" + g; if (b.length == 1) b = "0" + b;
            return "#" + r + g + b;
        }
    </script>
